<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icons. /color-taylor/ rather than a leading slash: vite.config.js flips `base`
      to /color-taylor/ for the GitHub Pages build, and an absolute /favicon.ico
      would 404 there. The old emoji-in-an-SVG favicon is gone - it depended on
      whichever emoji font the OS happened to have.

      Regenerate all of these with `node scripts/make-favicons.mjs`.
    -->
    <link rel="icon" href="/color-taylor/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/color-taylor/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/color-taylor/favicon-32.png" />
    <link rel="apple-touch-icon" href="/color-taylor/apple-touch-icon.png" />
    <link rel="manifest" href="/color-taylor/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Taylor 🎨🧵</title>
    <meta
      name="description"
      content="Understand color by moving it. Get hands-on with how RGB, HSB, and HSL colors relate."
    />

    <!--
      Link previews - WhatsApp, Messenger, Discord, Slack, Bluesky, X.

      https://redlamp.github.io/color-taylor/ is filled by the `color-taylor-site-url` plugin in
      vite.config.js, not by Vite's own /color-taylor/. These URLs must be absolute:
      the scraper fetches them without having loaded the page, and most will not
      resolve a relative og:image, so a `/color-taylor/og-image.jpg` here means a
      card with no picture on half the platforms.

      The artwork is the Figma Community thumbnail, and the title and
      description are the same lockup printed on it - one product, one face,
      wherever the link lands. Regenerate the image with
      `node scripts/make-og-image.mjs`; keep this copy in step with
      figma/brand/listing.md and public/manifest.webmanifest.

      Twitter's tags are still worth writing out. X and Bluesky both fall back
      to og:* when the twitter:* pair is missing, but `twitter:card` has no
      Open Graph equivalent, and without it X renders the small square
      thumbnail rather than the wide image.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Color Taylor" />
    <meta property="og:title" content="Color Taylor" />
    <meta
      property="og:description"
      content="Understand color by moving it. Get hands-on with how RGB, HSB, and HSL colors relate."
    />
    <meta property="og:url" content="https://redlamp.github.io/color-taylor/" />
    <meta property="og:image" content="https://redlamp.github.io/color-taylor/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Color Taylor hexagon - a six-cornered color field with red, green and blue vectors drawn across it - beside the words &quot;Understand color by moving it.&quot;"
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Color Taylor" />
    <meta
      name="twitter:description"
      content="Understand color by moving it. Get hands-on with how RGB, HSB, and HSL colors relate."
    />
    <meta name="twitter:image" content="https://redlamp.github.io/color-taylor/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="The Color Taylor hexagon - a six-cornered color field with red, green and blue vectors drawn across it - beside the words &quot;Understand color by moving it.&quot;"
    />
    <!--
      Theme bootstrap. Blocking on purpose, and it has to stay in <head>.

      ThemeProvider only adds `.dark` in an effect, so before React mounts the
      document had no theme class and --background resolved to the light value.
      On a dark-theme load the page therefore painted white first, and because
      App.tsx gives its background layer `transition: background-color 0.3s`, the
      wrong colour then animated to the right one - a visible fade on every load.

      Setting the class here means the first paint is already correct and the
      transition has nothing to run. The logic below must stay in step with
      ThemeProvider's initial state in src/hooks/useTheme.tsx: stored preference
      wins, and the system setting is the fallback.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('color-taylor-theme');
          var dark =
            saved !== null
              ? saved === 'dark'
              : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode, or storage blocked: fall through to the light default */
        }
      })();
    </script>
