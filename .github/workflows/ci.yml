name: CI

# Tests and deploy live in one workflow on purpose.
#
# They used to be two files, and `needs:` only works between jobs inside a single
# workflow - so a push to main started both at once and the deploy published
# whether or not the tests passed. The gate was procedural: someone had to
# remember to check dev was green first. Now the deploy cannot outrun a failure.
#
# The alternative was leaving deploy.yml separate and triggering it on
# `workflow_run`. That works but carries sharp edges - it evaluates the workflow
# file from the default branch, needs the target SHA checked out explicitly, and
# silently does nothing if the upstream run is skipped. One file is plainer.
#
# The gate is the fast half of the tests. `check` - lint, types, the unit
# suite, about a minute - is what deploy waits for; the Playwright suite runs
# beside it and does not hold the deploy. It used to: one job ran everything,
# and a push to main sat seven minutes behind an e2e run on the very commit
# the pull request had just run it on. The e2e still gates the merge, on the
# PR, and still runs on main for the record; what a red run on main means now
# is fix forward or revert, not "the site is still on the previous build".
# See wiki/notes/decision-fast-deploy-gate.md.
#
# No run on a push to dev. Every dev commit that matters opens a pull request,
# which runs the same jobs, and the push run was the same commit tested twice
# on two runners at once.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: pw-${{ runner.os }}-
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: check
    # Only from main, and never from a pull request - a PR must not be able to
    # publish. workflow_dispatch is allowed so a manual deploy is still possible,
    # but it now runs the tests first like everything else.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Write is only needed to push gh-pages, so it is scoped to this job rather
    # than granted to the whole workflow.
    permissions:
      contents: write
    # Job-level, not workflow-level: serialising deploys is right, serialising
    # every test run behind one gh-pages group is not.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          GITHUB_PAGES: '1'
      # Validates the link-preview tags against the artifact about to be
      # published - absolute URLs, the image present, declared size honest.
      # The test job checks the same tags off the dev server; this one checks
      # what actually ships, which is where %SITE_URL% is resolved for real.
      - run: node scripts/preview-link-card.mjs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
